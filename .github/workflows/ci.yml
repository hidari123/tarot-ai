# CI —— 持续集成
#
# 设计取舍（面试可讲）：
#   这个项目的核心风险不是"代码写错"，而是**"看起来对、实际坏"**：
#     - HITL 闸门抢跑 → 每场占卜撞满 8 分钟超时（功能全废但编译通过）
#     - SSE 加了 id: 字段 → 11 个客户端解析器整帧跳过（测试全红）
#     - 模型跳过仪式 → 32/34 条用例断言失败（质量指标失真）
#   这三类问题 **tsc 和 eslint 都发现不了**，只有真正跑一遍才暴露。
#   所以 CI 的重心放在「跑起来验证」，而不是「静态检查」。
#
# 三个阶段（快的先跑，快速失败）：
#   ① 静态门禁：typecheck + lint + build（~2 分钟，无需 LLM）
#   ② 静态验证：SSE 协议/防剧透/翻牌闸门/混沌测试（~1 分钟，无需 LLM）
#   ③ 动态评估：RAG 召回 + Agent 仪式（需 LLM key，配额受限时用 --only 子集）

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 并发取消：同一分支的新 push 自动取消旧 run（省 CI 配额）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠️ CI 里不需要真实 LLM —— 静态验证全部用固定样本
  #    动态评估阶段需要 key，见下方 secrets 配置
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ────────────────────────────────────────────────────────────
  # ① 静态门禁：类型 / lint / 构建
  # ────────────────────────────────────────────────────────────
  static:
    name: 静态门禁 (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # better-sqlite3 是原生模块：预编译二进制在多数平台可用，
      # 不可用时 node-gyp 需要 python3 + build-essential
      - name: 准备原生模块编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 生产构建
        run: npm run build

      # ⚠️ 离线验证（不需要服务、不需要 LLM）
      #    这些是**纯逻辑**断言：状态机转移表、限流器语义、守卫表覆盖率、
      #    降级路径同构、SSE 取消通道、断点续传触发条件。
      #    它们抓的是"看起来对、实际坏"的那类 bug（tsc 和 eslint 都发现不了）。
      - name: 离线验证套件
        run: |
          npx tsx scripts/verify-ritual-machine.mjs
          npx tsx scripts/verify-hitl-nudge.mjs
          npx tsx scripts/verify-rate-limiter.mjs
          npx tsx scripts/verify-rate-concurrency.mjs
          npx tsx scripts/verify-fallback-parity.mjs
          npx tsx scripts/verify-phase-guard.mjs
          npx tsx scripts/verify-runtime-state.mjs
          npx tsx scripts/verify-telemetry-buffer.mjs
          npx tsx scripts/verify-optimization-goals.mjs
          npx tsx scripts/verify-sse-cancel.mjs
          npx tsx scripts/verify-resume-trigger.mjs
          # ⚠️ 环境音：断言"阶段→氛围层"的映射与页面接线（音频是看不见的功能，
          #    最容易悄悄坏掉，而 CI 里没有别的东西能发现）
          npx tsx scripts/verify-ambience.mjs
          # ⚠️ 环境音**音色质量**（2026-11-07，用户反馈「很难听」驱动）：
          #    断言 sub-bass / super-saw / LFO 呼吸 / 和声轮换 / FM 钟琴 五要素，
          #    同时守住「消除空鸣」的既有修复不被回退。
          npx tsx scripts/verify-ambience-tone.mjs
          # ⚠️ UX 修复（2026-11-04 用户实测报告驱动）：
          #    追问入口 / 滚动条 / 限流去技术化 / 收束回响 / 思考气泡 / 翻牌可点性
          npx tsx scripts/verify-ux-fixes.mjs
          # ⚠️ SVG 图标集（2026-11-04）：断言 emoji 已清零 + 图标名类型有效
          npx tsx scripts/verify-icons.mjs
          # ⚠️ 第二轮优化（2026-11-04，docs/optimization-analysis-2026-11.md 的 22 项）：
          #    索引 / 内存清理 / 审校标记 / 错误边界 / prompt 瘦身 /
          #    快照写入量 / 缓存命中 / a11y / 代码分割 / 动效降级
          npx tsx scripts/verify-round2.mjs
          # ⚠️ 占卜双模式（2026-11-04）：快速一问 / 深度解读
          #    重点防守卫死锁 —— 快速模式跳过呼召，若守卫仍检查全部前置，
          #    选牌会被永久拦截（只在选快速模式时复现，深度模式完全正常）
          npx tsx scripts/verify-divination-mode.mjs
          # ⚠️ 快速模式收束守卫（2026-11-06）：
          #    重点守 close_reading 的守卫按模式分支 ——
          #    快速模式不做 interpret_card，若守卫仍检查 slot.reading
          #    → 永远拦截 → 模型反复重试 → 撞 max_rounds
          #    （真实流程由 scripts/dev/e2e-quick.mjs 手动验证）
          npx tsx scripts/verify-quick-mode.mjs
          # ⚠️ 运势矩阵（2026-11-04）：每日 / 周 / 月 / 季 / 年运流年
          #    重点守确定性（同一天永远同一张牌）与客户端/服务端分层
          #    （客户端组件间接引入 better-sqlite3 会让构建失败）
          npx tsx scripts/verify-fortune.mjs
          # ⚠️ 问神谕（2026-11-04）：免抽牌的对话式塔罗向导
          #    重点守「免抽牌」的**能力层**语义（工具集不含抽牌类工具）
          #    与「纯文本回答不被首答纠偏拦下」（否则神谕会死循环）
          npx tsx scripts/verify-oracle.mjs

  # ────────────────────────────────────────────────────────────
  # ② 静态验证：不需要 LLM 的功能回归
  # ────────────────────────────────────────────────────────────
  verify:
    name: 功能验证 (SSE/防剧透/翻牌闸门/混沌)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 准备原生模块编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential

      # ⚠️ 混沌测试要打真实端点 → 必须先起服务
      - name: 启动生产服务
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/api/health --timeout 120000

      # 前端结构 + 防剧透 + 翻牌闸门（静态源码级断言）
      - name: 前端结构与防剧透
        run: node scripts/verify-flip-frontend.mjs http://localhost:3000

      # 翻牌闸门（真实端点：点牌 → 409 抢跑 → 重试 → 成功）
      - name: 翻牌闸门竞态
        run: node scripts/verify-flip-gate.mjs http://localhost:3000

      # 混沌测试：畸形 body / 并发互斥 / 不存在会话
      - name: 混沌测试
        run: node scripts/chaos-test.mjs

      # 断点续传：断开 → Last-Event-ID 补发 → seq 连续无重复
      - name: SSE 断点续传
        run: node scripts/verify-resume.mjs http://localhost:3000

      # ⚠️ 公网鉴权（P1-④）：面板必须 401 / 正确令牌 200 / 安全头齐全 / 输入截断
      #    需要 DASHBOARD_TOKEN —— CI 里用一个**固定的测试令牌**（不是真密钥）
      #    ⚠️ 顺序：必须先写 .env.local（脚本从那里读令牌），再跑测试
      - name: 提供测试令牌
        run: |
          printf 'DASHBOARD_TOKEN=ci-test-token\n' > .env.local
          printf 'USER_KEY_SALT=ci-test-salt\n' >> .env.local

      - name: API 鉴权与安全头
        env:
          DASHBOARD_TOKEN: ci-test-token
        run: node scripts/verify-api-auth.mjs http://localhost:3000

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            data/*.db
            .next/**/*.log
          retention-days: 3

  # ────────────────────────────────────────────────────────────
  # ③ 动态评估：需要 LLM key
  #    配额受限时（实测网关约 4 次/80s 窗口）用 --only 子集
  # ────────────────────────────────────────────────────────────
  eval:
    name: 质量评估 (RAG 召回 + Agent 仪式)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    # ⚠️ 没有 key 就跳过 —— 不让 CI 变成红灯
    #    （公开仓库场景；内部项目应改成必需）
    if: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 准备原生模块编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential

      # RAG 召回：纯本地计算，不需要 LLM —— 但需要向量模型（首次会下载）
      - name: RAG 召回率（裸检索）
        run: node scripts/eval-rag.mjs

      - name: RAG 召回率（含查询改写 = 生产路径）
        run: node scripts/eval-rag.mjs --rewrite

      - name: 启动生产服务
        env:
          DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/api/health --timeout 120000

      # Agent 仪式评估：子集（配额受限）
      - name: Agent 仪式评估（子集）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.LLM_MODEL }}
        run: >
          node scripts/eval-agent.mjs http://localhost:3000
          --only=love-vague,work-specific,money,study-exam,human-boss
